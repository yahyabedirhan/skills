<rect x="40.5" y="76.5" width="879" height="91" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="109" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">low-level-design</text><text x="60" y="132" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">code: modules, classes, files, folders</text><text x="60" y="150" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">requirements → entities and relationships → class design → implementation → extensibility</text><rect x="40.5" y="180.5" width="879" height="91" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="213" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">system-design</text><text x="60" y="236" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">systems: services, data stores, APIs, scale</text><text x="60" y="254" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">requirements → core entities → API → data flow → high-level design → deep dives</text><rect x="40.5" y="284.5" width="879" height="91" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="317" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">cli-design</text><text x="60" y="340" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">command-line interfaces: commands, flags, output, help</text><text x="60" y="358" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">requirements → command model → inputs → output and errors → help → implementation → evolution</text><rect x="40.5" y="388.5" width="879" height="111" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="421" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">swift-performance</text><text x="60" y="444" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">Swift apps: what runs, how often, at what volume</text><text
