<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How the agent shows you its work</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter+Tight:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
.diagram-container{overflow-x:auto}
svg{display:block;min-width:960px}
</style>
</head>
<body>
<div class="diagram-container">
<svg viewBox="0 0 960 592" width="960" height="592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="communication-style-title communication-style-desc">
<title id="communication-style-title">How the agent shows you its work</title>
<desc id="communication-style-desc">Three show-me skills for explaining and reporting, and two skills for when you leave and come back.</desc>
<defs>
<linearGradient id="communication-style-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#222529"/><stop offset="1" stop-color="#131417"/></linearGradient>
<linearGradient id="communication-style-rim1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/></linearGradient><linearGradient id="communication-style-rim2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.14"/><stop offset="1" stop-color="#fff" stop-opacity="0.03"/></linearGradient>
<marker id="communication-style-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b9097"/></marker>
</defs>
<rect x="0" y="0" width="960" height="592" rx="12" fill="url(#communication-style-tile)"/>
<rect x="2.5" y="2.5" width="955" height="587" rx="10" fill="none" stroke="url(#communication-style-rim1)" stroke-width="1"/>
<rect x="10.5" y="10.5" width="939" height="571" rx="2" fill="none" stroke="url(#communication-style-rim2)" stroke-width="1"/>
<text x="40" y="52" font-family="Space Grotesk" font-weight="600" font-size="20" letter-spacing="-0.2" fill="#e4e6e9">How the agent shows you its work</text>

<rect x="40.5" y="76.5" width="879" height="91" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="109" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">show-me</text><text x="60" y="132" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">explains the current topic</text><text x="60" y="150" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">pseudocode · call tree · file tree · diff block · one focused HTML page</text><rect x="40.5" y="180.5" width="879" height="91" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="213" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">show-me-artifact</text><text x="60" y="236" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">a report or decision set to read later, as a hosted page</text><text x="60" y="254" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">status first · progress · item tree · tables · decision cards → republished to the same URL</text><rect x="40.5" y="284.5" width="879" height="91" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="317" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">show-me-diagram</text><text x="60" y="340" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">one designed diagram, through diagram-design</text><text x="60" y="358" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">type picked to fit · profiles shipped with it · opened in a browser</text><rect x="40.5" y="388.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="421" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">i-am-afk</text><text x="60" y="444" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">you&#x27;re away: work on alone, keep your part for the end</text><rect x="40.5" y="476.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="509" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">i-am-back</text><text x="60" y="532" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">you&#x27;re back: show-me what happened, what&#x27;s done and what needs you</text>
</svg>
</div>
</body>
</html>
