<rect x="40.5" y="76.5" width="879" height="103" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="108" font-family="IBM Plex Mono" font-size="10" letter-spacing="1.6" fill="#8b9097">START</text><text x="170" y="109" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">init-effort</text><text x="170" y="132" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">worktree and branch (or a new repo), decided once</text><text x="170" y="160" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">the session host, this session, or paste</text><text x="482" y="160" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">starts the thinking session</text><rect x="40.5" y="216.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="248" font-family="IBM Plex Mono" font-size="10" letter-spacing="1.6" fill="#8b9097">THINKING</text><text x="170" y="249" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">grilling, to-spec, to-tickets</text><text x="170" y="272" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">leaves a spec, tickets and a handoff</text><rect x="40.5" y="328.5" width="879" height="119" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="360" font-family="IBM Plex Mono" font-size="10" letter-spacing="1.6" fill="#8b9097">HANDOVER</text><text x="170" y="361" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">handover</text><text x="170" y="384" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">ready, prompt, mechanism, started</text><text x="170" y="412" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">handoff</text><text x="482" y="412" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">writes the handoff in the repo</text><text x="170" y="430" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">the session host, this session, or paste</text><text x="482" y="430" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">starts a fresh orchestrator</text><path d="M42.5 484.5 H905.5 L919.5 498.5 V621.5 Q919.5 623.5 917.5 623.5 H42.5 Q40.5 623.5 40.5 621.5 V486.5 Q40.5 484.5 42.5 484.5 Z" fill="#ffffff"/><path d="M905.5 484.5 V498.5 H919.5 Z" fill="#b9bec4"/><text x="60" y="516" font-family="IBM Plex Mono" font-size="10" letter-spacing="1.6" fill="#4f545b">BUILD</text><text x="170" y="517" font-family="Inter Tight" font-weight="600" font-size="15" fill="#131417">orchestrate-with-handoff → orchestrate-effort</text><text x="170" y="550" font-family="IBM Plex Mono" font-size="12" fill="#131417">orchestrating</text><text x="288" y="550" font-family="IBM Plex Mono" font-size="12" fill="#4f545b">the orchestrator&#x27;s discipline</text><text x="170" y="568" font-family="IBM Plex Mono" font-size="12" fill="#131417">implement</text><text x="288" y="568" font-family="IBM Plex Mono" font-size="12" fill="#4f545b">each ticket, built by a sub-agent</text><text x="170" y="586" font-family="IBM Plex Mono" font-size="12" fill="#131417">show-me</text><text x="288" y="586" font-family="IBM Plex Mono" font-size="12" fill="#4f545b">shows the plan</text><text x="170" y="604" font-family="IBM Plex Mono" font-size="12" fill="#131417">to-pr</text><text x="288" y="604" font-family="IBM Plex Mono" font-size="12" fill="#4f545b">last step: opens the pull request</text><rect x="40.5" y="660.5" width="879" height="103" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="692" font-family="IBM Plex Mono" font-size="10" letter-spacing="1.6" fill="#8b9097">SETTLE</text><text x="170" y="693" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">settle-effort</text><text x="170" y="716" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">after you approve: merge, follow up, carry over</text><text x="170" y="744" font-family="IBM Plex Mono" font-size="12" fill=
