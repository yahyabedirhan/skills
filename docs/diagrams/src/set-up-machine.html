<title id="set-up-machine-title">What set-up-machine writes</title>
<desc id="set-up-machine-desc">Each global rule goes from rules.json through inspection, one approved diff and verification, into the shared files, every harness and the global skills; running it again is the audit.</desc>
<defs>

<marker id="set-up-machine-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b9097"/></marker>
</defs>
<rect x="0" y="0" width="960" height="1164" rx="12" fill="url(#set-up-machine-tile)"/>
<rect x="2.5" y="2.5" width="955" height="1159" rx="10" fill="none" stroke="url(#set-up-machine-rim1)" stroke-width="1"/>
<rect x="10.5" y="10.5" width="939" height="1143" rx="2" fill="none" stroke="url(#set-up-machine-rim2)" stroke-width="1"/>
<text x="40" y="52" font-family="Space Grotesk" font-weight="600" font-size="20" letter-spacing="-0.2" fill="#e4e6e9">What set-up-machine writes</text>
<line x1="100.5" y1="152" x2="100.5" y2="186" stroke="#8b9097" stroke-width="1.25" marker-end="url(#set-up-machine-arrow)"/><line x1="100.5" y1="264" x2="100.5" y2="298" stroke="#8b9097" stroke-width="1.25" marker-end="url(#set-up-machine-arrow)"/><line x1="100.5" y1="376" x2="100.5" y2="410" stroke="#8b9097" stroke-width="1.25" marker-end="url(#set-up-machine-arrow)"/><line x1="100.5" y1="488" x2="100.5" y2="522" stroke="#8b9097" stroke-width="1.25" marker-end="url(#set-up-machine-arrow)"/>
<rect x="40.5" y="76.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="109" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">rules.json</text><text x="60" y="132" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">each global rule once: level, reason, instruction, samples</text><rect x="40.5" y="188.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="221" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">inspect + references</text><text x="60" y="244" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">the agent reads each harness&#x27;s files and its reference</text><path d="M42.5 300.5 H905.5 L919.5 314.5 V373.5 Q919.5 375.5 917.5 375.5 H42.5 Q40.5 375.5 40.5 373.5 V302.5 Q40.5 300.5 42.5 300.5 Z" fill="#ffffff"/><path d="M905.5 300.5 V314.5 H919.5 Z" fill="#b9bec4"/><text x="60" y="333" font-family="Inter Tight" font-weight="600" font-size="15" fill="#131417">one diff, one approval</text><text x="60" y="356" font-family="IBM Plex Mono" font-size="12" fill="#4f545b">added, tightened, gaps, extra rules; each file backed up, then written</text><rect x="40.5" y="412.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="445" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">verify.py</text><text x="60" y="468" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">the samples against the hook and Codex&#x27;s checker; every hook wired</text><rect x="40.5" y="524.5" width="879" height="159" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="557" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">Shared files</text><text x="60" y="590" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">~/.config/agents/AGENTS.md</text><text x="271" y="590" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">the shared global instructions: working agreement, glossary, environment defaults, rule</text><text x="271" y="606" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">lines, personal workflow</text><text x="60" y="628" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">~/.config/agents/source.md</text><text x="271" y="628" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">the pointer to your workstation repo, where your environment defaults, workflow and</text><text x="271" y="644" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">personal permissions come from</text><text x="60" y="666" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">pre_tool_hook.py</text><text x="271" y="666" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">runs before every tool call; reads a command as the shell runs it</text><rect x="40.5" y="696.5" width="879" height="251" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="729" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">Harnesses</text><text x="60" y="762" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">Claude Code  ~/.claude/</text><text x="314" y="762" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">settings.json: deny and ask entries, the hook, auto memory off; CLAUDE.md imports</text><text x="314" y="778" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">the shared file</text><text x="60" y="800" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">Codex        ~/.codex/</text><text x="314" y="800" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">rules/set-up-machine.rules, hooks.json, AGENTS.md → shared file, memories off in</text><text x="314" y="816" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">config.toml</text><text x="60" y="838" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">opencode     ~/.config/opencode/</text><text x="314" y="838" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">opencode.json permissions, plugins/set-up-machine.js runs the hook, AGENTS.md →</text><text x="314" y="854" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">shared file</text><text x="60" y="876" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">Cursor       ~/.cursor/</text><text x="314" y="876" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">cli-config.json permissions, hooks.json, rules/global-instructions.mdc copies the</text><text x="314" y="892" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">shared file</text><text x="60" y="914" font-family="IBM Plex Mono" font-size="12" fill="#e4e6e9">Pi           ~/.pi/agent/</text><text x="314" y="914" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">extensions/set-up-machine.ts runs the hook and asks for ask rows, AGENTS.md →</text><text x="314" y="930" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">shared file, declared settings.json defaults</text><rect x="40.5" y="960.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="993" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">~/.agents/skills</text><text x="60" y="1016" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">your skills repo (the skills-repo environment default), installed globally</text><rect x="40.5" y="1048.5" width="879" height="75" rx="2" fill="#222529" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="60" y="1081" font-family="Inter Tight" font-weight="600" font-size="15" fill="#e4e6e9">run again</text><text x="60" y="1104" font-family="IBM Plex Mono" font-size="12" fill="#8b9097">the audit: a diff that changes nothing</text>
</svg>
